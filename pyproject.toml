[project]
name = "grocery-planner"
version = "0.1.0"
description = "Local-first grocery price/deal planner: scrape, store, and compare grocery deals across stores."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "simpleeval>=0.9.13",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gplan = "grocery_planner.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grocery_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
