[project]
name = "grocery-planner"
version = "0.1.0"
description = "Local-first grocery price/deal planner: scrape, store, and compare grocery deals across stores."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "simpleeval>=0.9.13",
    "apscheduler>=3.10",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.6"]
build = ["pyinstaller>=6.0"]

[project.scripts]
gplan = "grocery_planner.cli:app"

[project.gui-scripts]
gplan-gui = "grocery_planner.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grocery_planner*", "db_script*"]

[tool.setuptools.package-data]
# db_script/ ships as its own top-level package purely so its .ddl/.dml
# schema scripts (and README) are included as installed package data — see
# db_script/README.md and grocery_planner/db.py for how they're located
# and executed at runtime.
db_script = ["init/*.ddl", "init/*.dml", "migration/*.ddl", "migration/*.dml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
