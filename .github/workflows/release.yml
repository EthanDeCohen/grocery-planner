# ===========================================================================
# Publish a release (GFP-96).
# ===========================================================================
# GFP-96 needs an in-app update check to have something to check AGAINST, and
# noted that this did not exist: the binaries were CI artifacts, which expire,
# require a GitHub login to download, and have no version anyone can compare
# to. This is the prerequisite it named.
#
# TAG-TRIGGERED, and the tag is the source of truth for the version. The first
# job refuses to build if the tag and grocery_planner.__version__ disagree,
# because the update check compares exactly those two strings: a mismatch does
# not fail loudly, it tells every existing install either that no update
# exists when one does, or that one exists forever after they take it.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# COST: two runners, one of them macOS at 10x, so roughly 80-100 allowance-
# minutes per release. Releases are rare and each one is the artifact a
# customer actually downloads, so this is the least questionable macOS spend
# in the project. See ci.yml for the allowance history (GFP-94).
# ===========================================================================
name: Release

on:
  push:
    tags: ["v*"]
  # Deliberately no workflow_dispatch: a release without a tag would produce a
  # build whose version nothing can verify, which is the exact failure the
  # guard below exists to prevent.

permissions:
  contents: write        # required to create the release

jobs:
  # ---------------------------------------------------------------------- #
  # Cheap, fast, and first. Finding a version mismatch after paying for two
  # PyInstaller builds would be finding it in the most expensive place.
  # ---------------------------------------------------------------------- #
  verify-version:
    name: the tag and __version__ must agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('grocery_planner/__init__.py').read_text()).group(1))")
          echo "tag:        $GITHUB_REF_NAME  -> $TAG"
          echo "__version__: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo
            echo "MISMATCH. The in-app update check (GFP-96) compares the release"
            echo "tag against grocery_planner.__version__. If they differ, every"
            echo "install is told the wrong thing -- and keeps being told it."
            echo "Bump __version__ (and pyproject.toml) to match the tag, or tag"
            echo "the version that is actually in the code."
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true          # a half-published release is worse than none
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,gui]"

      # GFP-344: what is actually inside the 238 MB a customer downloads.
      #
      # Generated from the environment that is about to be frozen, not from
      # pyproject.toml -- an SBOM built from the manifest describes what should
      # have been installed, which is the one thing you cannot trust in the
      # situation an SBOM exists for.
      #
      # The script FAILS the release if the document is empty or missing a
      # declared dependency. A silently absent SBOM is the same failure shape
      # as a silently unsigned release.
      - name: Generate the SBOM
        run: python scripts/build_sbom.py --output sbom.cdx.json

      - name: Build
        working-directory: packaging
        run: |
          pyinstaller gplan.spec --noconfirm --distpath ../dist --workpath ../build
          pyinstaller gplan-gui.spec --noconfirm --distpath ../dist --workpath ../build

      # The ZIP is what a customer downloads, so it contains everything the
      # installer needs NEXT TO ITSELF -- install.ps1 looks for the binaries
      # beside it, so a release that shipped them separately would not install.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Via env, never inlined into the script body: a secret interpolated
          # into a `run:` block can be echoed by a shell trace or a failing
          # command. GitHub masks it in logs either way, but not in artifacts.
          KROGER_CREDENTIAL: ${{ secrets.KROGER_CREDENTIAL }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "protein-ledger-${{ github.ref_name }}-windows"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          # GFP-320: one-directory builds, so these are folders. install.ps1
          # flattens them into the install root.
          Copy-Item dist/gplan, dist/gplan-gui $name/ -Recurse
          Copy-Item packaging/install.ps1, packaging/uninstall.ps1 $name/
          # GFP-161: the double-click entry points. A .cmd carries no
          # execution-policy restriction, so a user never meets one.
          Copy-Item packaging/Install.cmd, packaging/Uninstall.cmd $name/
          Copy-Item packaging/INSTALL.md, packaging/UNINSTALL.md $name/
          # GFP-344: inside the ZIP, so it travels with what the customer
          # holds -- and so it lands in the one-click installer's payload
          # without the installer needing to know about it.
          Copy-Item sbom.cdx.json $name/
          # And on its own, so it can be read without a 238 MB download.
          Copy-Item sbom.cdx.json "$name.sbom.cdx.json"
          "SBOM=$name.sbom.cdx.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # GFP-146: the Kroger credential, written from a repository secret
          # and never from a file in the repo. If the secret is unset the
          # release still builds -- a credential-free build is legitimate, and
          # failing the release would be a worse outcome than shipping one.
          if ($env:KROGER_CREDENTIAL) {
            # -Encoding ascii deliberately, NOT utf8: PowerShell 5.1 writes a
            # BOM with utf8, which breaks an INI section header. GFP-93 was
            # exactly this bug. (utf-8-sig on the read side now copes, but
            # writing a clean file is the fix that does not rely on it.)
            $env:KROGER_CREDENTIAL | Out-File -FilePath "$name/kroger-env.config" -Encoding ascii
            Write-Host "bundled kroger-env.config ($($env:KROGER_CREDENTIAL.Length) chars)"
          } else {
            Write-Host "::warning::KROGER_CREDENTIAL secret is not set; this release ships without a credential"
          }
          # Prove the binary in the ZIP runs before anyone downloads it.
          & "$name/gplan/gplan.exe" version
          Compress-Archive -Path $name -DestinationPath "$name.zip" -Force
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          KROGER_CREDENTIAL: ${{ secrets.KROGER_CREDENTIAL }}
        run: |
          set -euo pipefail
          NAME="protein-ledger-${{ github.ref_name }}-macos"
          mkdir -p "$NAME"
          cp -R dist/gplan "$NAME/"
          cp -R "dist/gplan-gui.app" "$NAME/Protein Ledger.app"
          cp packaging/install.sh packaging/uninstall.sh "$NAME/"
          # GFP-161: Finder will not run a .sh on a double-click; it will
          # run a .command.
          cp packaging/Install.command packaging/Uninstall.command "$NAME/"
          cp packaging/INSTALL.md packaging/UNINSTALL.md "$NAME/"
          # GFP-344, as for Windows.
          cp sbom.cdx.json "$NAME/"
          cp sbom.cdx.json "$NAME.sbom.cdx.json"
          echo "SBOM=$NAME.sbom.cdx.json" >> "$GITHUB_ENV"
          # GFP-146, as for Windows. `set -u` is on, so the unset case needs
          # the :- default rather than a bare test.
          if [ -n "${KROGER_CREDENTIAL:-}" ]; then
            printf '%s\n' "$KROGER_CREDENTIAL" > "$NAME/kroger-env.config"
            echo "bundled kroger-env.config (${#KROGER_CREDENTIAL} chars)"
          else
            echo "::warning::KROGER_CREDENTIAL secret is not set; this release ships without a credential"
          fi
          chmod +x "$NAME/install.sh" "$NAME/uninstall.sh" "$NAME/gplan/gplan"
          chmod +x "$NAME/Install.command" "$NAME/Uninstall.command"
          "$NAME/gplan/gplan" version
          # ditto, not zip: it preserves the .app bundle's symlinks and
          # resource forks. A bundle round-tripped through plain zip can arrive
          # unlaunchable, which nobody discovers until a customer double-clicks.
          ditto -c -k --sequesterRsrc --keepParent "$NAME" "$NAME.zip"
          echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"

      # GFP-340: the one-click installer. Built FROM the ZIP that was just
      # packaged, so the two artifacts are the same bits and the ZIP keeps
      # working for anyone mid-transition. The stub only unpacks and hands over
      # to the install.ps1 inside, which is what keeps the installed footprint
      # identical to the ZIP's -- GFP-102 pinned those names, and a second
      # installer that laid them down differently would be a second app.
      #
      # It is NOT signed yet. GFP-341 adds that and makes the release fail when
      # it is missing; until then SmartScreen still says "unknown publisher".
      - name: Build the one-click installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "ProteinLedger-Setup-${{ github.ref_name }}.exe"
          ./scripts/build_setup_exe.ps1 -Payload $env:ASSET -Output $setup
          "SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
          if-no-files-found: error

      # Uploaded on its own because only Windows produces one -- folding it
      # into the step above would need an empty path on the macOS leg, and
      # if-no-files-found: error is worth more than one fewer step.
      - name: Upload the one-click installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: setup-windows
          path: ${{ env.SETUP }}
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List what will be published
        run: ls -la assets

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.zip
            assets/*.exe
            assets/*.sbom.cdx.json
          generate_release_notes: true
          # Not a draft and not a prerelease: the update check reads
          # /releases/latest, which SKIPS both. A draft release would publish
          # binaries that no installed copy can ever be told about.
          draft: false
          prerelease: false
          body: |
            ## Install

            **Windows — one file, one click.** Download
            `ProteinLedger-Setup-*.exe` and double-click it. It unpacks into
            your Downloads folder and installs, closing the app first if you
            happen to have it open. Nothing to unzip.

            Windows will warn that the publisher is unknown, because the
            installer is not signed yet — choose **More info** then **Run
            anyway**. Signing is tracked in GFP-341.

            **macOS — and Windows the old way.** Download the ZIP for your
            operating system, unzip it, and run the installer inside —
            `install.ps1` on Windows, `./install.sh` on macOS. Full
            instructions are in `INSTALL.md` in the ZIP.

            Installing again over an existing copy is safe and keeps your data.

            ## What is inside it

            Each build publishes a CycloneDX SBOM (`*.sbom.cdx.json`) listing
            every third-party package frozen into the binaries, and the same
            file ships inside the ZIP. It is generated from the environment
            that was built, so it records what was actually included rather
            than what a manifest said should be.

            **macOS:** this build is not signed by Apple, so the first launch is
            refused. Right-click the app and choose Open, once — or run
            `./install.sh --clear-quarantine`. See `INSTALL.md`.

            To remove it: `UNINSTALL.md`, also in the ZIP and installed
            alongside the app.
