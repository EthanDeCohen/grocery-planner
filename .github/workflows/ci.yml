# ===========================================================================
# CI -- restored by GFP-95 after the GFP-94 cost pause.
# ===========================================================================
# The real Windows + macOS CI is back. This is deliberately NOT a byte-for-byte
# restore of what ran before the pause: restoring that verbatim would have
# recreated the outage it was paused for.
#
# WHAT WENT WRONG BEFORE (measured 2026-08-01)
#   * `push: branches: ["**"]` AND `pull_request` both fired, so every commit
#     on a PR branch cost TWO full runs.
#   * No concurrency control, so pushing again while a run was in flight paid
#     for both.
#   * ~26 allowance-minutes per run, 98 runs in one day: the entire 2,000-min
#     monthly free allowance gone in a single day, hard-blocking CI.
#   GitHub bills Windows at 2x and macOS at 10x, which is what makes a matrix
#   that looks cheap in wall-clock expensive in allowance.
#
# WHAT CHANGED, and why each one
#   1. `push` restricted to `main`. A PR now runs ONCE (via pull_request)
#      instead of twice, with no loss of coverage -- the same code is still
#      tested before merge. This is the dominant saving.
#   2. `concurrency: cancel-in-progress` -- a new push supersedes a run still
#      in flight instead of paying for both. This is what makes an
#      iterate-quickly day affordable.
#   3. The BINARY jobs no longer run on pull requests. They are the 10x macOS
#      cost, and a PyInstaller break is a packaging problem rather than a logic
#      one, so it need not gate every PR commit.
#
# ACCEPTED TRADEOFF: a packaging break is caught at merge or on dispatch, not
# at PR time. Dispatch before merging anything touching packaging/, a
# dependency, or platform-specific behaviour:
#
#     gh workflow run ci.yml --ref <branch>
#
# scripts/verify.ps1 remains the local pre-merge gate and is still the fastest
# way to find a problem; CI is the cross-platform check a Windows dev machine
# cannot perform.
# ===========================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Grouped by ref so main and a PR branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # tests/test_schema_guard.py (GFP-61) runs here too -- it pins
        # db_script/init/0001_GFP-9.ddl's checksum, checks the committed
        # schema snapshot against a freshly built database, and asserts
        # db_script/ script hygiene. No separate job needed: it's plain
        # pytest, already collected under testpaths (pyproject.toml).
        run: pytest

      - name: Run PowerShell smoke test
        shell: pwsh
        run: ./scripts/smoke_test.ps1

  # GFP-10: PyInstaller cannot cross-compile, so each OS builds its own binary.
  # macOS is built here because it cannot be built on the Windows dev machine.
  #
  # main and workflow_dispatch only -- see the cost note at the top of this file.
  binary:
    name: binary (${{ matrix.os }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # GFP-81 adds the `gui` extra: the .app bundle cannot be built without
      # PySide6 installed. It is a heavy install on a 10x runner, which is
      # affordable only because this job no longer runs on pull requests.
      - name: Install package + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,gui]"

      - name: Build the CLI binary
        working-directory: packaging
        run: pyinstaller gplan.spec --noconfirm --distpath ../dist --workpath ../build

      # GFP-81: the GUI binary, and on macOS a real .app bundle. PyInstaller
      # cannot cross-compile (GFP-10), so this is the ONLY place a macOS .app
      # can be produced -- nobody on the team runs macOS, and without this the
      # GUI would ship there untested and unbuilt.
      #
      # gplan-gui.spec excludes Qt WebEngine deliberately (see GFP-79); that is
      # what keeps this bundle ~50 MB rather than ~250 MB.
      - name: Build the GUI binary
        working-directory: packaging
        run: pyinstaller gplan-gui.spec --noconfirm --distpath ../dist --workpath ../build

      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GROCERY_PLANNER_DB: ${{ runner.temp }}/ci-binary.sqlite3
        run: |
          ./dist/gplan.exe version
          ./dist/gplan.exe stores
          # APScheduler resolves triggers by name; a missing hidden import in the
          # spec surfaces here and nowhere earlier.
          ./dist/gplan.exe schedule set foodlion --every 6h
          ./dist/gplan.exe schedule list

      - name: Smoke test the binary (macOS)
        if: runner.os == 'macOS'
        env:
          GROCERY_PLANNER_DB: ${{ runner.temp }}/ci-binary.sqlite3
        run: |
          ./dist/gplan version
          ./dist/gplan stores
          ./dist/gplan schedule set foodlion --every 6h
          ./dist/gplan schedule list

      # GFP-81: prove the .app is a real bundle, not just that PyInstaller
      # exited 0. A malformed bundle still produces a directory, so check the
      # things macOS actually requires: the Info.plist, the declared identifier,
      # and an executable at the path the plist names. Launching the GUI itself
      # is not possible here -- a CI runner has no display -- so this asserts
      # structure, and GFP-116 will assert that INSTALLING it works.
      - name: Verify the macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="dist/gplan-gui.app"
          test -d "$APP" || { echo "no .app bundle at $APP"; exit 1; }
          PLIST="$APP/Contents/Info.plist"
          test -f "$PLIST" || { echo "bundle has no Info.plist"; exit 1; }
          IDENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          echo "bundle identifier: $IDENT"
          test "$IDENT" = "com.grocery-planner.gui" \
            || { echo "unexpected bundle identifier: $IDENT"; exit 1; }
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST")
          test -x "$APP/Contents/MacOS/$BIN" \
            || { echo "no executable at Contents/MacOS/$BIN"; exit 1; }
          echo "bundle size: $(du -sh "$APP" | cut -f1)"

      - name: Check the Windows GUI binary exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/gplan-gui.exe)) { throw "gplan-gui.exe was not built" }
          "gplan-gui.exe: {0:N1} MB" -f ((Get-Item dist/gplan-gui.exe).Length / 1MB)

      # GFP-91: assemble what a user actually downloads. The installers and the
      # docs ship INSIDE the ZIP alongside the binaries -- install.ps1 looks
      # for the binaries next to itself, so a release that separated them would
      # not install.
      - name: Assemble the release folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/gplan.exe, dist/gplan-gui.exe release/
          Copy-Item packaging/install.ps1, packaging/uninstall.ps1 release/
          Copy-Item packaging/INSTALL.md, packaging/UNINSTALL.md release/

      - name: Assemble the release folder (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/gplan release/
          cp -R "dist/gplan-gui.app" "release/Grocery Planner.app"
          cp packaging/install.sh packaging/uninstall.sh release/
          cp packaging/INSTALL.md packaging/UNINSTALL.md release/
          chmod +x release/install.sh release/uninstall.sh

      # GFP-91: the installers are PowerShell and shell, so pytest cannot run
      # them -- tests/test_installer_scripts.py can only check that the pinned
      # names have not drifted. THIS is where they are executed for real, and
      # it is the only place the machine-wide steps (PATH, Start Menu, the
      # registry, the symlink, the shell profile) are ever exercised: a dev
      # machine is not a place to test writing to someone's registry, and a
      # runner is thrown away afterwards.
      #
      # Run TWICE, because idempotence is an explicit requirement of the ticket
      # and the second run is the only thing that tests it.
      - name: Install for real, twice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./release/install.ps1 -DryRun
          ./release/install.ps1
          ./release/install.ps1        # idempotence: must change nothing

          $root = Join-Path $env:LOCALAPPDATA "Programs\GroceryPlanner"
          foreach ($f in @("gplan.exe", "gplan-gui.exe", "install-manifest.json")) {
              if (-not (Test-Path (Join-Path $root $f))) { throw "missing after install: $f" }
          }

          # The installed binary must run from where it was installed.
          & (Join-Path $root "gplan.exe") version

          # PATH: exactly ONE entry, however many times the installer ran.
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $hits = @($userPath.Split(";") | Where-Object { $_.TrimEnd("\") -ieq $root.TrimEnd("\") })
          if ($hits.Count -ne 1) { throw "PATH has $($hits.Count) entries for $root, expected 1" }

          # Start Menu: one shortcut, not two.
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Grocery Planner"
          $links = @(Get-ChildItem $menu -Filter *.lnk -ErrorAction SilentlyContinue)
          if ($links.Count -ne 1) { throw "expected 1 Start Menu shortcut, found $($links.Count)" }

          # The manifest is what the uninstaller (GFP-92) reads, so a malformed
          # one is a silent failure to remove credentials later.
          $manifest = Get-Content (Join-Path $root "install-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 1) { throw "unexpected manifest schema: $($manifest.schema)" }
          if (-not $manifest.version) { throw "manifest records no version" }
          Write-Host "installed version: $($manifest.version)"

          # Add/Remove Programs. Its UninstallString must point at a script
          # that EXISTS -- an entry whose Uninstall button does nothing is
          # worse than no entry, because the user believes the credentials in
          # their data folder are gone when they are not.
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GroceryPlanner"
          if (-not (Test-Path $key)) { throw "no Add/Remove Programs entry" }
          $arp = Get-ItemProperty $key
          if ($arp.DisplayName -ne "Grocery Planner") { throw "wrong DisplayName: $($arp.DisplayName)" }
          if ($arp.UninstallString -notmatch '"(.+uninstall\.ps1)"') { throw "UninstallString names no script: $($arp.UninstallString)" }
          if (-not (Test-Path $Matches[1])) { throw "UninstallString points at a missing file: $($Matches[1])" }

      - name: Install for real, twice (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ./release/install.sh --dry-run
          ./release/install.sh
          ./release/install.sh          # idempotence: must change nothing

          ROOT="$HOME/.local/share/grocery-planner"
          test -x "$ROOT/gplan"                  || { echo "no CLI at $ROOT/gplan"; exit 1; }
          test -f "$ROOT/install-manifest.json"  || { echo "no manifest"; exit 1; }
          test -d "$HOME/Applications/Grocery Planner.app" || { echo "no .app"; exit 1; }

          # The symlink must point at the installed binary, not at the ZIP the
          # user is about to delete.
          test -L "$HOME/.local/bin/gplan" || { echo "no symlink on PATH"; exit 1; }
          LINK="$(readlink "$HOME/.local/bin/gplan")"
          test "$LINK" = "$ROOT/gplan" || { echo "symlink points at $LINK"; exit 1; }

          "$HOME/.local/bin/gplan" version

          # The PATH line must appear at most once however many times we ran.
          if [ -f "$HOME/.zprofile" ]; then
            COUNT=$(grep -c "added by Grocery Planner installer" "$HOME/.zprofile" || true)
            test "$COUNT" -le 1 || { echo "$COUNT PATH lines in .zprofile"; exit 1; }
          fi

          python3 - "$ROOT/install-manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          assert m["schema"] == 1, m["schema"]
          assert m["version"], "manifest records no version"
          assert m["files"], "manifest lists no files"
          print("installed version:", m["version"])
          PY

      # GFP-92: uninstall for real, and check the machine afterwards rather
      # than trusting the script's own summary. An uninstaller that PRINTS
      # success while leaving a credential behind is the exact failure mode
      # this is guarding, and it cannot be caught by reading the output.
      #
      # Run TWICE here as well: the ticket requires that running it on a
      # machine with nothing installed exits cleanly instead of erroring.
      - name: Uninstall for real, and verify nothing is left (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "Programs\GroceryPlanner"

          # Plant a credential-shaped file so "did it remove the secrets?" is
          # an observation rather than an assumption.
          $data = Join-Path $env:LOCALAPPDATA "grocery-planner\grocery-planner"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -Path (Join-Path $data "kroger-env.config") -Value "client_secret=NOTAREALSECRET"
          Set-Content -Path (Join-Path $data "wholefoods_session.json") -Value '{"wfm_store_d8": "fake"}'

          & (Join-Path $root "uninstall.ps1") -DryRun
          if (-not (Test-Path (Join-Path $data "kroger-env.config"))) {
              throw "a DRY RUN deleted a credential"
          }

          & (Join-Path $root "uninstall.ps1") -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall reported failures (exit $LASTEXITCODE)" }

          # Now check the MACHINE, not the transcript.
          if (Test-Path $root) { throw "program files survived: $root" }
          if (Test-Path $data) { throw "application data survived: $data" }
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Grocery Planner"
          if (Test-Path $menu) { throw "Start Menu folder survived: $menu" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -and ($userPath -split ";" | Where-Object { $_ -like "*GroceryPlanner*" })) {
              throw "PATH entry survived"
          }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GroceryPlanner") {
              throw "Add/Remove Programs entry survived"
          }

          # Idempotence: on a machine with nothing installed it must exit 0.
          Copy-Item packaging/uninstall.ps1 $env:RUNNER_TEMP -Force
          & (Join-Path $env:RUNNER_TEMP "uninstall.ps1") -Yes
          if ($LASTEXITCODE -ne 0) { throw "second uninstall did not exit cleanly" }

      - name: Uninstall for real, and verify nothing is left (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ROOT="$HOME/.local/share/grocery-planner"
          DATA="$HOME/Library/Application Support/grocery-planner"

          mkdir -p "$DATA"
          echo "client_secret=NOTAREALSECRET" > "$DATA/kroger-env.config"
          echo '{"wfm_store_d8": "fake"}'     > "$DATA/wholefoods_session.json"

          "$ROOT/uninstall.sh" --dry-run
          test -f "$DATA/kroger-env.config" || { echo "a DRY RUN deleted a credential"; exit 1; }

          "$ROOT/uninstall.sh" --yes

          # Check the machine, not the transcript.
          test ! -d "$ROOT" || { echo "program files survived: $ROOT"; exit 1; }
          test ! -d "$DATA" || { echo "application data survived: $DATA"; exit 1; }
          test ! -e "$HOME/Applications/Grocery Planner.app" || { echo ".app survived"; exit 1; }
          test ! -L "$HOME/.local/bin/gplan" || { echo "symlink survived"; exit 1; }
          if launchctl list 2>/dev/null | grep -q grocery; then
            echo "a LaunchAgent is still loaded"; exit 1
          fi

          # Idempotence: nothing installed must exit 0, not error.
          cp packaging/uninstall.sh "$RUNNER_TEMP/uninstall.sh"
          chmod +x "$RUNNER_TEMP/uninstall.sh"
          "$RUNNER_TEMP/uninstall.sh" --yes

      # The .app is a DIRECTORY, so it is listed explicitly -- a glob that
      # matched only files would upload an empty artifact and pass.
      - uses: actions/upload-artifact@v4
        with:
          name: gplan-${{ matrix.os }}
          path: release
          if-no-files-found: error
